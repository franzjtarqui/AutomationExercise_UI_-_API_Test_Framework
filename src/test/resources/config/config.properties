# Active environment. automationexercise.com only exposes "prod", but this scheme allows
# adding qa/staging in the future without touching code (just add the <env>.base.url.* block).
env=prod

prod.base.url.ui=https://automationexercise.com
prod.base.url.api=https://automationexercise.com/api

# Default browser for the UI suite (chrome | firefox | edge)
browser=chrome
headless=false

# Explicit waits (WaitUtils / BasePage). See PLAN.md section 8: no Thread.sleep,
# no implicit waits.
timeout.explicit.seconds=15
timeout.polling.millis=250
