name: CI

# Pipeline design: PLAN.md section 9.
#   push/PR/schedule -> build -> (test-ui headless | test-api) -> allure-report -> GitHub Pages
#
# No GitHub Secrets are required: all test data (users, accounts) is generated dynamically
# with Faker and cleans itself up (PLAN.md section 7); the only "seed" is ephemeral and lives
# within each scenario/step definition.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly: mitigates residual flakiness of the site under load (PLAN.md section 10).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # needed to publish the Allure report to the gh-pages branch

jobs:
  build:
    name: Build (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        run: mvn -B compile

  test-ui:
    name: UI tests (headless)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ubuntu-latest already ships with Google Chrome preinstalled; Selenium Manager resolves
      # the matching chromedriver (PLAN.md section 1, no WebDriverManager).
      - name: Run UI suite
        run: mvn -B test -Dsuite=ui -Dheadless=true

      - name: Upload Allure results (UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: target/allure-results
          retention-days: 20
          if-no-files-found: warn

  test-api:
    name: API tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run API suite
        run: mvn -B test -Dsuite=api

      - name: Upload Allure results (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: target/allure-results
          retention-days: 20
          if-no-files-found: warn

  allure-report:
    name: Allure report + GitHub Pages
    needs: [test-ui, test-api]
    if: always() # also generate the report when UI or API failed, to help diagnose issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Allure results (UI)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-ui
          path: allure-results

      - name: Download Allure results (API)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-api
          path: allure-results

      # Trend history across builds (Allure trend/history charts). On the first run the branch
      # doesn't exist yet, hence continue-on-error.
      - name: Get previous Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Merge results and seed previous history
        shell: bash
        run: |
          mkdir -p target/allure-results
          cp -R allure-results/. target/allure-results/ 2>/dev/null || true
          mkdir -p target/site/allure-maven-plugin/history
          if [ -d gh-pages/history ]; then cp -R gh-pages/history/. target/site/allure-maven-plugin/history/; fi

      # Generate the report with the allure-maven-plugin already configured in pom.xml. Replaces
      # simple-elf/allure-report-action, whose runtime Docker build fails on GitHub runners.
      - name: Generate Allure report
        run: mvn -B allure:report

      - name: Upload Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 20
          if-no-files-found: warn

      - name: Publish report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin
